name: Validate cAdvisor source-bound release

on:
  pull_request:
    paths:
      - '.dockerignore'
      - 'CODESTRA_UPSTREAM_LOCK.json'
      - 'upstream/**'
      - 'codestra/deploy/**'
      - 'codestra/release/**'
      - 'scripts/validate_codestra_cadvisor.py'
      - 'scripts/validate_codestra_cadvisor_corporate.py'
      - 'scripts/validate_rendered_cadvisor_images.py'
      - 'scripts/validate_repository_readiness.py'
      - '.github/workflows/validate-cadvisor-source-release.yml'
      - '.github/workflows/validate-codestra-cadvisor.yml'
  push:
    branches: [development, test, staging, production, main]
    paths:
      - '.dockerignore'
      - 'CODESTRA_UPSTREAM_LOCK.json'
      - 'upstream/**'
      - 'codestra/deploy/**'
      - 'codestra/release/**'
      - 'scripts/validate_codestra_cadvisor.py'
      - 'scripts/validate_codestra_cadvisor_corporate.py'
      - 'scripts/validate_rendered_cadvisor_images.py'
      - 'scripts/validate_repository_readiness.py'
      - '.github/workflows/validate-cadvisor-source-release.yml'
      - '.github/workflows/validate-codestra-cadvisor.yml'

permissions:
  contents: read

concurrency:
  group: cadvisor-source-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: Set up Go from the exact governed source
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum

      - name: Test protocol-level readiness probe
        run: |
          gofmt -w codestra/deploy/healthcheck.go codestra/deploy/healthcheck_test.go
          git diff --exit-code -- codestra/deploy/healthcheck.go codestra/deploy/healthcheck_test.go
          go test codestra/deploy/healthcheck.go codestra/deploy/healthcheck_test.go
          go vet codestra/deploy/healthcheck.go codestra/deploy/healthcheck_test.go
          CGO_ENABLED=0 go build -trimpath -o /tmp/codestra-healthcheck codestra/deploy/healthcheck.go

      - name: Validate repository source and release contracts
        env:
          PYTHONPYCACHEPREFIX: /tmp/codestra-cadvisor-pycache
        run: |
          python -m py_compile \
            scripts/validate_codestra_cadvisor.py \
            scripts/validate_codestra_cadvisor_corporate.py \
            scripts/validate_rendered_cadvisor_images.py \
            scripts/validate_repository_readiness.py
          python scripts/validate_codestra_cadvisor_corporate.py
          python scripts/validate_repository_readiness.py

      - name: Render and validate exact image identities
        shell: bash
        run: |
          set -Eeuo pipefail
          export GO_BUILDER_IMAGE="$(jq -r .builderImage codestra/release/runtime-base.lock.json)"
          export PROXY_RUNTIME_IMAGE="$(jq -r .proxyRuntimeImage codestra/release/runtime-base.lock.json)"
          export CADVISOR_BASE_IMAGE="$(jq -r .cadvisorBaseImage codestra/release/runtime-base.lock.json)"
          export CADVISOR_SOURCE_COMMIT="$(jq -r .upstream_commit CODESTRA_UPSTREAM_LOCK.json)"
          export CODESTRA_CADVISOR_PROXY_IMAGE='ghcr.io/appolon1908-hue/codestra-cadvisor-proxy:ci@sha256:3333333333333333333333333333333333333333333333333333333333333333'
          export CODESTRA_CADVISOR_IMAGE='ghcr.io/appolon1908-hue/codestra-cadvisor:ci@sha256:4444444444444444444444444444444444444444444444444444444444444444'
          export DOCKER_SOCKET_GID=999
          export CODESTRA_ENVIRONMENT=test
          export CODESTRA_REGION=ci
          export CODESTRA_SERVER=github-actions
          export CODESTRA_CADVISOR_DEPLOYMENT_ID="${GITHUB_SHA}"
          export CADVISOR_DOCKER_ROOT_PATH=/tmp/codestra-cadvisor/docker-root
          export CADVISOR_DEVICE_METADATA_PATH=/tmp/codestra-cadvisor/dev-disk
          export CODESTRA_OBSERVABILITY_NETWORK=codestra-observability
          docker compose -f codestra/deploy/compose.candidate.yaml config > /tmp/codestra-cadvisor-compose.yaml
          python scripts/validate_rendered_cadvisor_images.py /tmp/codestra-cadvisor-compose.yaml

      - name: Build deployable image from exact vendored source and verify revision
        shell: bash
        run: |
          set -Eeuo pipefail
          builder="$(jq -r .builderImage codestra/release/runtime-base.lock.json)"
          substrate="$(jq -r .cadvisorBaseImage codestra/release/runtime-base.lock.json)"
          source_commit="$(jq -r .upstream_commit CODESTRA_UPSTREAM_LOCK.json)"
          test "$source_commit" = "$(jq -r .cadvisorBinarySourceCommit codestra/release/runtime-base.lock.json)"
          docker build \
            --file codestra/deploy/Dockerfile.cadvisor \
            --build-arg "GO_BUILDER_IMAGE=${builder}" \
            --build-arg "CADVISOR_BASE_IMAGE=${substrate}" \
            --build-arg "CADVISOR_SOURCE_COMMIT=${source_commit}" \
            --tag codestra-cadvisor-source-ci:exact \
            .
          output="$(docker run --rm --entrypoint /usr/bin/cadvisor codestra-cadvisor-source-ci:exact --version 2>&1)"
          printf '%s\n' "$output"
          grep -Fq "$source_commit" <<<"$output"
          test "$(docker image inspect codestra-cadvisor-source-ci:exact --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$source_commit"

      - name: Verify clean exact-head patch
        run: git diff --check
