name: Codestra Upstream Source Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CODESTRA_UPSTREAM.json
      - .github/workflows/upstream-source-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import official upstream source
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t values < <(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('CODESTRA_UPSTREAM.json').read_text())
          print(data['upstream_clone_url']); print(data['upstream_ref']); print(data['import_path'])
          PY
          )
          UPSTREAM_URL="${values[0]}"; UPSTREAM_REF="${values[1]}"; IMPORT_PATH="${values[2]}"
          [[ "$UPSTREAM_URL" == "https://github.com/google/cadvisor.git" ]]
          [[ "$UPSTREAM_REF" == "master" ]]
          [[ "$IMPORT_PATH" == "upstream" ]]
          rm -rf .codestra-upstream-src "$IMPORT_PATH"
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --branch "$UPSTREAM_REF" "$UPSTREAM_URL" .codestra-upstream-src
          UPSTREAM_SHA="$(git -C .codestra-upstream-src rev-parse HEAD)"
          rm -rf .codestra-upstream-src/.git
          mv .codestra-upstream-src "$IMPORT_PATH"
          export UPSTREAM_URL UPSTREAM_REF UPSTREAM_SHA
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('CODESTRA_UPSTREAM_LOCK.json').write_text(json.dumps({'schema_version':'1.0','upstream_clone_url':os.environ['UPSTREAM_URL'],'upstream_ref':os.environ['UPSTREAM_REF'],'upstream_commit':os.environ['UPSTREAM_SHA'],'import_path':'upstream','synchronized_at':datetime.now(timezone.utc).isoformat(),'deployment_enabled':False,'secret_material_allowed_in_git':False},indent=2)+'\n')
          PY
          git config user.name 'codestra-upstream-sync'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A upstream CODESTRA_UPSTREAM_LOCK.json
          git diff --cached --quiet && exit 0
          git commit -m "vendor: sync official cAdvisor upstream ${UPSTREAM_SHA}"
          git push origin HEAD:main
