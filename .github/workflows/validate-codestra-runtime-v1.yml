name: Validate Codestra cAdvisor runtime v1

on:
  pull_request:
    paths:
      - "codestra/runtime-v1/**"
      - ".github/workflows/validate-codestra-runtime-v1.yml"
  push:
    branches:
      - development
      - test
      - staging
      - production
      - main
    paths:
      - "codestra/runtime-v1/**"
      - ".github/workflows/validate-codestra-runtime-v1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate corporate metrics and security contract
        shell: python
        run: |
          from pathlib import Path
          import json
          import yaml

          root = Path("codestra/runtime-v1")
          compose_text = (root / "compose-codestra.yaml").read_text()
          compose = yaml.safe_load(compose_text)
          contract = json.loads((root / "metrics-contract.json").read_text())
          service = compose["services"]["cadvisor"]
          commands = service["command"]
          command_text = "\n".join(commands)

          approved = {
              "com.codestra.business", "com.codestra.application",
              "com.codestra.service", "com.codestra.environment",
              "com.codestra.deployment", "com.codestra.owner",
          }
          allow_arg = next(v for v in commands if v.startswith("--whitelisted_container_labels="))
          actual = set(allow_arg.split("=", 1)[1].split(","))
          assert actual == approved
          assert "--store_container_labels=false" in commands
          assert "--docker_only=true" in commands
          disabled = next(v for v in commands if v.startswith("--disable_metrics="))
          for metric in ("process", "tcp", "udp", "advtcp"):
              assert metric in disabled
          assert "ports" not in service
          assert service["read_only"] is True
          assert "ALL" in service["cap_drop"]
          assert "${CADVISOR_PRIVILEGED:-false}" in compose_text
          assert all(":ro" in mount for mount in service["volumes"])
          assert contract["rules"]["rawDockerLabelsExported"] is False
          assert contract["rules"]["privilegedModeRequiresApprovedHostException"] is True
          assert not set(contract["forbiddenContainerLabels"]) & set(contract["approvedContainerLabels"].values())
          assert "latest" not in compose_text.lower()
          print("Codestra cAdvisor runtime validation PASS")
      - name: Validate Compose structure without resolving runtime values
        run: docker compose -f codestra/runtime-v1/compose-codestra.yaml config --no-interpolate >/dev/null
