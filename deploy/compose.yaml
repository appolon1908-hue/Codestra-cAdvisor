name: codestra-cadvisor

services:
  cadvisor:
    image: ${CADVISOR_IMAGE:?CADVISOR_IMAGE must be an immutable image reference containing @sha256:}
    restart: unless-stopped
    network_mode: host
    privileged: true
    read_only: true
    stop_grace_period: 20s
    command:
      - --listen_ip=${CADVISOR_LISTEN_IP:?CADVISOR_LISTEN_IP must be a private host address}
      - --port=${CADVISOR_PORT:-8080}
      - --prometheus_endpoint=/metrics
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --profiling=false
      - --housekeeping_interval=10s
      - --max_housekeeping_interval=30s
      - --storage_duration=2m0s
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
